<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Site Proxy (lightweight)</title>
    <style>body{font-family:system-ui, -apple-system, Arial;padding:12px} #frame{width:100%;height:80vh;border:1px solid #ccc}</style>
  </head>
  <body>
    <h3>Site Proxy (lightweight)</h3>
    <p>Enter a URL and click "Load via HTTP proxy". This lightweight proxy rewrites HTML and streams assets. It is development-only — do not expose publicly without authentication.</p>
    <div>
      <input id="url" placeholder="https://example.com" size="60" />
      <button id="loadProxy">Load via HTTP proxy</button>
    </div>
    <iframe id="frame"></iframe>

    <script>
      document.getElementById('loadProxy').addEventListener('click', () => {
        const u = document.getElementById('url').value.trim();
        if (!u) return;
        document.getElementById('frame').src = '/proxy?url=' + encodeURIComponent(u);
      });
    </script>
  </body>
</html>
