<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Site Proxy</title></head>
  <body>
    <h3>Site Proxy (development)</h3>
    <form id="f">
      <input id="url" placeholder="https://example.com" size="60" />
      <button type="submit">Load</button>
    </form>
    <div style="margin-top:10px">
      <iframe id="frame" style="width:100%;height:80vh;border:1px solid #ccc"></iframe>
    </div>

    <script>
      document.getElementById('f').addEventListener('submit', (e) => {
        e.preventDefault();
        const u = document.getElementById('url').value.trim();
        if (!u) return;
        document.getElementById('frame').src = '/proxy?url=' + encodeURIComponent(u);
      });
    </script>
  </body>
</html>
